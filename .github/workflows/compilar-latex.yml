name: Compilar LaTeX

# Compila as QUATRO peças do pedido de patente a cada Pull Request e a cada push
# na branch main, e publica os PDFs como artefato do build.
#
# O art. 16 da Portaria/INPI/DIRPA nº 14/2024 exige que relatório descritivo,
# reivindicações, desenhos e resumo sejam documentos separados, com numeração de
# páginas independente. Por isso são quatro raízes LaTeX e quatro PDFs — que são
# exatamente os arquivos anexados no Peticionamento Eletrônico do INPI.
#
# O workflow também: (a) roda o chktex como lint advisory dos arquivos de prosa
# (não bloqueia o build), (b) gera o showcase dos dois eixos de seleção e a
# cópia de comparação e (c) repete tudo no Windows, para provar que o template
# funciona igual nos dois sistemas.
#
# CONTEXTO (importante para quem USA o template): os passos só-do-template — o
# showcase, a cópia de comparação e o job inteiro do Windows — rodam APENAS
# neste repositório, via guarda `if: github.repository == '<repo do
# template>'`. Em pedidos DERIVADOS do template eles são pulados
# automaticamente; quem está escrevendo um pedido real vê só lint + compilação
# das suas quatro peças + conformidade + publicação dos PDFs.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancela execuções anteriores ainda em andamento para o mesmo ref.
concurrency:
  group: latex-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compilar:
    name: Compilar as peças do pedido
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v6

      # Ferramentas usadas pelos passos de lint e de conformidade (rodam no
      # host, fora do contêiner TeX Live): chktex (análise estática da prosa) e
      # poppler-utils (pdftotext/pdfimages/pdfinfo, para inspecionar os PDFs).
      # O Python dos scripts já vem no runner.
      - name: Instalar ferramentas (lint + conformidade)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq chktex poppler-utils

      # Lint ADVISORY: aponta problemas de prosa sem bloquear o build.
      # `make lint` para não haver duas listas de supressões divergindo.
      - name: Lint (chktex, advisory)
        continue-on-error: true
        run: make lint

      # Compila as quatro raízes numa imagem TeX Live completa. Os argumentos
      # padrão da ação já incluem -halt-on-error, então um erro grave derruba o
      # build em vez de gerar um PDF com erro silencioso.
      #
      # Os .log ficam no workspace e o passo de conformidade depende disso: é
      # neles que estão os avisos de transbordamento de caixa e de margem de
      # figura, que o LaTeX não trata como erro mas o INPI trataria.
      - name: Compilar as quatro peças com latexmk
        uses: xu-cheng/latex-action@v4
        with:
          root_file: |
            relatorio-descritivo.tex
            reivindicacoes.tex
            desenhos.tex
            resumo.tex

      - name: Publicar as peças do pedido como artefato
        uses: actions/upload-artifact@v7
        with:
          name: pedido-de-patente-pdf
          path: |
            relatorio-descritivo.pdf
            reivindicacoes.pdf
            desenhos.pdf
            resumo.pdf
          if-no-files-found: error

      # Rede de CONFORMIDADE (BLOQUEANTE): afirma sobre os PDFs recém-gerados
      # cada exigência de forma da Portaria/INPI/DIRPA nº 14/2024 que é
      # verificável automaticamente — paginação n/N por peça (art. 16), 20 a 35
      # linhas por página (art. 17), ausência de representação gráfica fora dos
      # desenhos (art. 19), título idêntico no relatório e no resumo (art. 24),
      # numeração sequencial dos parágrafos (art. 26), congruência das figuras
      # (arts. 26, III e 39, V), forma das reivindicações (art. 28) e limite de
      # uma página do resumo (art. 40).
      #
      # Diferente da antiga rede de regressão, esta NÃO é só-do-template: ela
      # verifica a norma, não o conteúdo-exemplo, e por isso vale também para os
      # pedidos escritos a partir do template. --check-only usa os PDFs que o
      # passo anterior gerou, sem recompilar.
      - name: Verificar conformidade normativa
        run: python3 verificar-conformidade.py --check-only

      # Showcase (SÓ-DO-TEMPLATE): gera as quatro peças para cada combinação dos
      # dois eixos de seleção (natureza e modalidade), provando que os seletores
      # de dados-do-pedido.tex realmente chaveiam o que deveriam. Pulado em
      # pedidos derivados do template. Veja gerar-exemplos.py.
      # O script injeta valores por -pretex, o que a ação latex-action não sabe
      # expressar; rodamos o script na mesma imagem TeX Live, diretamente (ela
      # traz o python3).
      - name: Gerar o showcase dos eixos de seleção
        if: github.repository == 'igorrflorentino/inpi-template-pedido-propriedade-intelectual'
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            texlive/texlive:latest python3 gerar-exemplos.py

      - name: Publicar o showcase como artefato
        if: github.repository == 'igorrflorentino/inpi-template-pedido-propriedade-intelectual'
        uses: actions/upload-artifact@v7
        with:
          name: exemplos-pdf
          path: exemplo-*.pdf
          if-no-files-found: error

      # Cópia de comparação (SÓ-DO-TEMPLATE): prova que a mesma fonte gera as
      # duas saídas exigidas pelo art. 57 — os documentos do pedido sem
      # sinalização (inciso I, já compilados acima) e a cópia com tachado e
      # sublinhado (inciso II). O conteúdo-exemplo traz marcações de propósito,
      # para que as duas saídas realmente difiram.
      - name: Gerar a cópia de comparação
        if: github.repository == 'igorrflorentino/inpi-template-pedido-propriedade-intelectual'
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            texlive/texlive:latest python3 gerar-copia-de-comparacao.py

      - name: Publicar a cópia de comparação como artefato
        if: github.repository == 'igorrflorentino/inpi-template-pedido-propriedade-intelectual'
        uses: actions/upload-artifact@v7
        with:
          name: copia-de-comparacao-pdf
          path: '*-comparacao.pdf'
          if-no-files-found: error

  # WINDOWS (SÓ-DO-TEMPLATE): o mesmo fluxo, do jeito que roda na máquina de
  # quem escreve o pedido no Windows — pelo make.bat, no Prompt de Comando e no
  # PowerShell, com o TeX Live e o poppler nativos e os arquivos de texto com
  # fim de linha CRLF. Existe para que nenhuma mudança volte a amarrar o
  # template ao Linux sem ninguém perceber: um sed, um caminho com barra, um
  # acento na linha de comando. Pulado em pedidos derivados, onde só custaria
  # minutos de CI (o minuto do Windows vale dois em repositório privado).
  windows:
    name: Compilar e verificar no Windows
    if: github.repository == 'igorrflorentino/inpi-template-pedido-propriedade-intelectual'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      # O padrão do instalador do Git for Windows: os .tex, .sty e .md chegam
      # com CRLF, e só o que o .gitattributes fixa (os .py em LF, o make.bat em
      # CRLF) escapa da conversão. É o caso que precisa ser provado.
      - name: Fim de linha como no Git for Windows
        run: git config --global core.autocrlf true

      - name: Checkout do repositório
        uses: actions/checkout@v6

      # O mínimo para as quatro peças: o que o scheme-basic não traz e os
      # pacotes, fontes e padrões de hifenização que o lib/inpitex.sty carrega.
      - name: Instalar o TeX Live
        uses: TeX-Live/setup-texlive-action@v4
        with:
          packages: |
            scheme-basic
            latexmk
            chktex
            babel-portuges
            hyphen-portuguese
            helvetic
            ec
            setspace
            lastpage
            enumitem
            booktabs
            ulem
            etoolbox

      # O build do poppler para Windows que o winget e o Scoop distribuem,
      # baixado direto e conferido pelo SHA-256 publicado no manifesto do Scoop.
      - name: Instalar o poppler (pdftotext, pdfinfo, pdfimages)
        shell: pwsh
        run: |
          $versao = '26.09.0-0'
          $zip = Join-Path $env:RUNNER_TEMP 'poppler.zip'
          Invoke-WebRequest "https://github.com/oschwartz10612/poppler-windows/releases/download/v$versao/Release-$versao.zip" -OutFile $zip
          $esperado = '7a6f256a0ddf7536182246a5733331bf4677cbcc34f4663774947ad34556c8d0'
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne $esperado) { throw 'SHA-256 do poppler não confere' }
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
          Add-Content $env:GITHUB_PATH (Join-Path $env:RUNNER_TEMP "poppler-$($versao.Split('-')[0])\Library\bin")

      # Um alvo por passo, digitado como o usuário digita: `make <alvo>` no
      # Prompt de Comando encontra o make.bat da pasta atual.
      - name: make pdf (Prompt de Comando)
        shell: cmd
        run: make pdf

      - name: make verificar (Prompt de Comando)
        shell: cmd
        run: make verificar

      - name: make comparacao (Prompt de Comando)
        shell: cmd
        run: make comparacao

      # O showcase é o único caminho que injeta TeX pela linha de comando do
      # latexmk, e é justamente o que o Windows trata de outro jeito.
      - name: make exemplos (Prompt de Comando)
        shell: cmd
        run: make exemplos

      - name: make lint (Prompt de Comando, advisory)
        shell: cmd
        continue-on-error: true
        run: make lint

      # No PowerShell o .\ é obrigatório: ele não executa arquivo da pasta atual
      # pelo nome.
      - name: .\make ajuda e .\make limpar (PowerShell)
        shell: pwsh
        run: |
          .\make ajuda
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\make limpar
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sobras = Get-ChildItem -Name *.pdf, *.aux, *.log, *.fls, *.fdb_latexmk
          if ($sobras) { throw "make limpar deixou para trás: $sobras" }
