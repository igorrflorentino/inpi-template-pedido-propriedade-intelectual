name: Compilar LaTeX

# Compila o documento (main.tex) automaticamente a cada Pull Request e a cada
# push na branch main, garantindo que a ficha catalográfica e o restante do
# relatório sempre compilem antes do merge. O PDF gerado fica disponível como
# artefato do build.
#
# Além do main.tex, compila os exemplos de demonstração (exemplo-academico,
# exemplo-publicacao, exemplo-corporativo e exemplo-probatorio) e os publica como
# artefato "exemplos-pdf" — assim é possível ver cada tipo de documento sem
# compilar nada localmente.
#
# O workflow também: (a) roda o chktex como lint advisory dos arquivos de prosa
# (não bloqueia o build) e (b) executa verificar-ocultamento.sh como rede de
# REGRESSÃO da exibição automática de elementos opcionais (este BLOQUEIA o build
# se algum elemento passar a aparecer/sumir indevidamente).
#
# CONTEXTO (importante para quem USA o template): os passos só-do-template — a
# rede de regressão e o showcase de exemplos — rodam APENAS neste repositório,
# via guarda `if: github.repository == '<repo do template>'`. Em documentos
# DERIVADOS do template, esses passos são pulados automaticamente; o usuário vê
# só lint + compilar o seu main.tex + publicar o PDF, sem atrito.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancela execuções anteriores ainda em andamento para o mesmo ref.
concurrency:
  group: latex-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compilar:
    name: Compilar main.tex
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v6

      # Ferramentas usadas pelos passos de lint e de verificação (rodam no host,
      # fora do contêiner TeX Live): chktex (análise estática) e poppler-utils
      # (pdftotext, para extrair texto do PDF na rede de regressão).
      - name: Instalar ferramentas (lint + verificação)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq chktex poppler-utils

      # Lint ADVISORY: aponta problemas de prosa (ex.: falta de ~ antes de
      # citação) sem bloquear o build. As mesmas supressões do `make lint`.
      - name: Lint (chktex, advisory)
        continue-on-error: true
        run: chktex -q -n1 -n8 -n12 -n24 -n36 -n38 -n44 elementos-textuais/*.tex elementos-pre-textuais/*.tex

      # Roda latexmk dentro de uma imagem TeX Live completa (inclui abntex2,
      # glossaries, makeglossaries, makeindex etc.). O .latexmkrc do repositório
      # é respeitado, então o glossário e a lista de siglas são gerados.
      - name: Compilar com latexmk
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex

      - name: Publicar PDF como artefato
        uses: actions/upload-artifact@v7
        with:
          name: main-pdf
          path: main.pdf
          if-no-files-found: error

      # Rede de REGRESSÃO (SÓ-DO-TEMPLATE, bloqueante): confere que cada elemento
      # opcional apareceu/sumiu como esperado PARA O CONTEÚDO-EXEMPLO PADRÃO. Por
      # ser calibrada ao conteúdo do template, roda só neste repo — em documentos
      # derivados (outro github.repository) é pulada, p/ não travar o build real.
      - name: Verificar ocultamento de elementos (regressão)
        if: github.repository == 'igorrflorentino/embrapa-template-documentos-latex-abnt'
        run: bash verificar-ocultamento.sh --check-only

      # Showcase (SÓ-DO-TEMPLATE): gera uma amostra de cada tipo de documento,
      # reaproveitando o conteúdo do main.tex (os drivers exemplo-*.tex apenas
      # injetam o tipo). Pulado em documentos derivados. Veja gerar-exemplos.sh.
      - name: Compilar exemplos (academico, publicacao, corporativo e probatorio)
        if: github.repository == 'igorrflorentino/embrapa-template-documentos-latex-abnt'
        uses: xu-cheng/latex-action@v3
        with:
          root_file: |
            exemplo-academico.tex
            exemplo-publicacao.tex
            exemplo-corporativo.tex
            exemplo-probatorio.tex

      - name: Publicar exemplos como artefato
        if: github.repository == 'igorrflorentino/embrapa-template-documentos-latex-abnt'
        uses: actions/upload-artifact@v7
        with:
          name: exemplos-pdf
          path: |
            exemplo-academico.pdf
            exemplo-publicacao.pdf
            exemplo-corporativo.pdf
            exemplo-probatorio.pdf
          if-no-files-found: error
